[package]
name = "petri-contract"
version = "6.5.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/RohanGlitched/petri"
description = "The Petri dish on NEAR: Life with colony ownership, and the PETRI token it mints."

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "=5.29.1"
petri-core = { path = "../core" }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
# The v6.3 contract, frozen, so the relaunch test can build a real v6.3 state.
petri-contract-v6-3 = { path = "v6_3" }
# The v6.4 contract (749f246), frozen, so the upgrade test can build a real v6.4 state and run v6.5 over it.
petri-contract-v6-4 = { path = "v6_4" }
